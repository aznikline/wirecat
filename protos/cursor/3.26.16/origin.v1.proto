service OriginService {
  rpc ListHostedRepos(ListHostedReposRequest) returns (ListHostedReposResponse);
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc CreateRepoAndEnsureUserNamespace(CreateRepoRequest) returns (CreateRepoResponse);
  rpc PublishAgentTempRepo(PublishAgentTempRepoRequest) returns (PublishAgentTempRepoResponse);
  rpc CreateMirroredRepo(CreateMirroredRepoRequest) returns (CreateRepoResponse);
  rpc FilterMirrorableGithubRepos(FilterMirrorableGithubReposRequest) returns (FilterMirrorableGithubReposResponse);
  rpc DeleteRepo(DeleteRepoClientRequest) returns (DeleteRepoClientResponse);
  rpc DeleteMirroredRepo(DeleteMirroredRepoRequest) returns (DeleteMirroredRepoResponse);
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);
  rpc GetRepoWithMirrorInfo(GetRepoRequest) returns (GetRepoWithMirrorInfoResponse);
  rpc GetRepoByGithubMirror(GetRepoByGithubMirrorRequest) returns (GetRepoWithMirrorInfoResponse);
  rpc RecordCloneKitUsage(RecordCloneKitUsageRequest) returns (RecordCloneKitUsageResponse);
  rpc UpdateRepoMergeSettings(UpdateRepoMergeSettingsRequest) returns (UpdateRepoMergeSettingsResponse);
  rpc UpdateRepoBranchDeletionSetting(UpdateRepoBranchDeletionSettingRequest) returns (UpdateRepoBranchDeletionSettingResponse);
  rpc ListRepoOwnerNoticeTeamSlackChannels(ListRepoOwnerNoticeTeamSlackChannelsRequest) returns (ListRepoOwnerNoticeTeamSlackChannelsResponse);
  rpc SetRepoOwnerNoticeTeamSlackChannel(SetRepoOwnerNoticeTeamSlackChannelRequest) returns (SetRepoOwnerNoticeTeamSlackChannelResponse);
